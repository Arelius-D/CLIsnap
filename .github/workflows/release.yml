name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Package
        run: npx vsce package --out clisnap-${{ github.ref_name }}.vsix

      - name: Check nothing internal is in the package
        run: |
          LEAKED=$(unzip -Z1 clisnap-${{ github.ref_name }}.vsix \
            | grep -E 'extension/(src|tools|bin|docs|\.vscode|node_modules)/|\.ts$|\.map$' || true)
          if [ -n "$LEAKED" ]; then
            echo "$LEAKED"
            exit 1
          fi
          unzip -Z1 clisnap-${{ github.ref_name }}.vsix

      - name: Publish to the marketplace
        run: npx vsce publish --packagePath clisnap-${{ github.ref_name }}.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Attach the vsix to the release
        uses: softprops/action-gh-release@v2
        with:
          files: clisnap-${{ github.ref_name }}.vsix
